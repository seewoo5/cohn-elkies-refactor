name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      LEAN_NUM_THREADS: 2   # cap concurrent Lean processes (the module DAG allows up to 8)
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          # `lean-action` otherwise tars the whole `.lake` directory into the GitHub cache. That
          # is about 10 GB here (Mathlib's build alone is 6.5 GB), which does not fit next to
          # itself on the runner's 14 GB disk and fails with "No space left on device"; it is
          # also redundant, since `lake exe cache get` already fetches Mathlib's `.olean` files,
          # and it would blow the 10 GB per-repository cache limit shared with the Pages workflow.
          use-github-cache: false
      # The GitHub Pages site is owned by the blueprint workflow (`pages.yml`); re-enable
      # docgen only if you move one of the two to a different publishing target.
      # - uses: leanprover-community/docgen-action@v1
