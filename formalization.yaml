    - source: "Cohn–Gonçalves 2019, Theorem 1.4 (existence of extremizers for A₋(d))"
      lean: "CohnElkies.exists_signRadius_eq_signUncertaintyConstant_neg_one"
      module: "CohnElkies/SignUncertainty/Extremizer.lean"
      status: "proved"
      note: "weak L² compactness (InnerProductSpace.tendsto_subseq_inner_left_of_norm_le, CohnElkiesForMathlib/Analysis/InnerProductSpace/WeakSequentialCompactness.lean) and the no-concentration lemma Real.exists_pos_le_setIntegral_norm_compl_closedBall_of_fourier_eq_mul (CohnElkiesForMathlib/Analysis/Fourier/EigenfunctionConcentration.lean) in place of Nazarov–Jaming and Mazur"

