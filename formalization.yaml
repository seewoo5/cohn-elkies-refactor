automation:
  methods:
    - method: "agent"
      models: ["Astra (OpenAI)"]
      framework: "Codex"
      tool_setup: "OpenAI's original formalization SpherePacking.lean (see sources)"
      cost:
        wall_time: "1 week (as reported in openai/ten-proofs)"
        spend_usd: ""
        hardware: ""
      prompting_notes: "See https://openai.com/index/ten-advances-in-mathematics/"
    - method: "agent"
      models: ["claude-fable-5-1", "claude-opus-5", "claude-sonnet-5"]
      framework: "Claude Code (desktop app), one coordinating session with background subagents"
      tool_setup: >-
        lean4-skills plugin and lean-lsp MCP server; scripts for the mechanical split, reformatting
        and renaming; per-module golfing agents under an "exports contract"; semantic tasks
        (two-sign lower bound, generic saddle polynomial and f₀, L¹ theory and Theorem 1.2) as
        single agents; module reorganization and cleanup agents; leanprover/comparator as the
        independent check of the main statements; verso-blueprint for the blueprint.
      cost:
        wall_time: "≈ 4 days (2026-09-12 to 2026-09-15) of largely unattended agent work"
        spend_usd: "subscription-based usage"
        hardware: "one laptop (16 GB RAM), Lean 4.33.1 + Mathlib v4.33.1; API-only models"
      prompting_notes: >-
        Task specifications in natural language with the report's statements, hard rules
        (default maxHeartbeats, no sorry, standard axioms, verification with `lake env lean`,
        names/statements frozen for downstream modules) and required reports; see
        RefactoringPlan.md and RefactoringResult.md.
  spend_usd: "subscription-based usage"
  notes: >-
    The refactoring followed RefactoringPlan.md: mechanical split of the original file, global
    renaming to the report's notation, per-module golfing (≈ 40 % shorter per module), the new
    theorems, reorganization into an import DAG with a Mathlib-ready library, a cleanup pass, the
    comparator challenge and the blueprint. Human involvement: the plan, review of intermediate
    reports, and design decisions (dropping the numeric certificate, the L¹ formulation of the
    sign-uncertainty constants, reinstating Appendix A, then asking for the unconditional strict
    inequality via Cohn–Gonçalves' existence theorem).

fidelity:
  divergences: >-
    Proof arguments kept from the original formalization where they differ from the report: the
    interior bound of Lemma 3.2 by a Phragmén-Lindelöf principle on the strip (with a capped
    majorant) instead of the Poisson principle; one-sided Lemma 3.3; the limit of Lemma 3.4 via a
    Frullani/Wallis-kernel integral instead of the digamma log-moment identity (22); a single
    inverse-quadratic majorant in Lemma 3.5; Lemma 4.8 in strict-inequality form and Lemma 4.10 in
    positivity form; the upper half of Theorem 1.1 fused into a sandwich argument. The parameters
    of Section 4 are the report's (a₀ = ε², A = log(1/ε), b(a) = 1 - 2ε(1+a), N = ⌈log λ⌉); the
    absolute constant of Lemma 4.2 is c = 2. The Schwartz approximation of Section 2.1 convolves with a compactly
    supported bump instead of the Gaussian κ_n. The sign-uncertainty class is represented by
    continuous Fourier-inversion representatives (𝓕 g = ς g pointwise). The rotational average is
    written ∫ f(U⁻¹x) dU rather than the report's ∫ f(Ux) dU (the same function; only left
    invariance of the Haar measure is then needed). The Cohn-Elkies bound Δ_d ≤ LP_d, cited by the
    report, is proved. The existence of extremizers for A₋(d) (Cohn–Gonçalves 2019, Theorem 1.4)
    is proved with a qualitative compactness lemma (no-concentration of Fourier eigenfunctions)
    instead of the Nazarov–Jaming uncertainty principle, and without Mazur's lemma. Details:
    RefactoringResult.md §1.3-1.6 and §5.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    Every module compiles with Mathlib's standard linter set and the default maxHeartbeats, with
    no sorry and only the standard axioms; the five main statements were checked against the
    Mathlib-only challenge ComparatorChallenges/CohnElkies.lean with leanprover/comparator (Lean
    kernel replay accepted; landrun sandbox only in CI). The informal blueprint (CohnElkiesBlueprint/)
    links every formalized node to its declaration, and its summary page reports which nodes are
    formalized. GitHub Actions builds the two libraries, the challenge and the single-file
    assembly on every push, runs the comparator, and deploys the blueprint to GitHub Pages.
    No human line-by-line review yet.

