# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.

version: "v0.4"

project:
  name: "CohnElkies"
  description: >-
    Lean 4 + Mathlib formalization of Chapter 1 of OpenAI's report "Ten proofs": the exact
    exponential rate of the Cohn-Elkies linear programming bound for sphere packings,
    LP_d^{1/d} → sqrt(e/(2π)) (Theorem 1.1, with the packing consequence Δ_d ≤ (sqrt(e/(2π)) + o(1))^d),
    and the asymptotics A_±(d)/√d → 1/π of the sign-uncertainty constants of L¹ Fourier
    eigenfunctions (Theorem 1.2). A readable reformalization (module DAG, Mathlib-ready library,
    blueprint, comparator challenge) of OpenAI's single-file formalization, extended by the results
    that file did not contain (both Fourier eigenvalues in the lower bound, the self-Fourier
    function f₀, the L¹ radial reduction and Schwartz approximation, Theorem 1.2).
  authors: ["Seewoo Lee"]
  responsible_maintainers: ["Seewoo Lee"]
  license: "Apache-2.0"
  repository: "https://github.com/seewoo5/cohn-elkies-refactor"
  blueprint: "https://seewoo5.github.io/cohn-elkies-refactor/"

sources:
  - title: "Ten advances in mathematics and theoretical computer science (Chapter 1: sharp asymptotics of the Cohn-Elkies bound and sign uncertainty)"
    authors: ["OpenAI"]
    id: "https://cdn.openai.com/pdf/ten-proofs-oai.pdf"
    type: "report"
    location: "Chapter 1 (Sections 1-4, Appendix A)"
    relationship: "formalizes"
    note: >-
      Sections 1-4 and Appendix A are formalized in full; the strict inequality A₊(d) < A₋(d) of
      Appendix A uses the existence of extremizers for A₋(d) (Cohn–Gonçalves 2019, Theorem 1.4),
      which is formalized as well (existence part).
    license: ""
    author_endorsement: "not-contacted"
  - title: "SpherePacking.lean of the repository openai/ten-proofs (the original single-file formalization)"
    authors: ["OpenAI"]
    id: "https://github.com/openai/ten-proofs/blob/main/SpherePacking.lean"
    type: "formalization"
    location: "SpherePacking.lean (55,616 lines)"
    relationship: "adapts"
    note: >-
      Refactored (renamed, golfed, split into modules), the numeric certificate removed, and
      extended; the definitions of the comparator challenge are kept verbatim.
    license: "Apache-2.0"
    author_endorsement: "not-contacted"
  - title: "Sphere-Packing-Lean (sphere packings, periodic packings and the Cohn–Elkies bound via Poisson summation)"
    authors: ["Sidharth Hariharan", "Gareth Ma", "Christopher Birkbeck", "Maryna Viazovska", "Bhavik Mehta", "et al."]
    id: "https://github.com/thefundamentaltheor3m/Sphere-Packing-Lean"
    type: "formalization"
    relationship: "background"
    note: "The packing-density and Poisson-summation material of the original file comes from this project."
    license: "Apache-2.0"
    author_endorsement: "not-contacted"
  - title: "Cohn, Elkies: New upper bounds on sphere packings I"
    authors: ["Henry Cohn", "Noam Elkies"]
    id: "https://doi.org/10.4007/annals.2003.157.689"
    type: "article"
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Cohn, Gonçalves: An optimal uncertainty principle in twelve dimensions via modular forms"
    authors: ["Henry Cohn", "Felipe Gonçalves"]
    id: "https://doi.org/10.1007/s00222-019-00875-4"
    type: "article"
    location: "Lemma 3.1 and Theorem 1.4 (existence of extremizers, Section 3.2), cited by Appendix A of the report"
    relationship: "formalizes"
    note: >-
      The existence part of Theorem 1.4 for the eigenvalue -1 is formalized
      (CohnElkies.exists_signRadius_eq_signUncertaintyConstant_neg_one), following Section 3.2 with
      the quantitative uncertainty principle of Nazarov–Jaming replaced by a compactness argument
      and without Mazur's lemma; Lemma 3.1's origin correction is CohnElkies.originCorrection. The
      infinitely-many-roots part of Theorem 1.4 and the twelve-dimensional results are not
      formalized.
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/openai/ten-proofs"
    note: "The original formalization this project refactors and extends."
  - id: "https://github.com/thefundamentaltheor3m/Sphere-Packing-Lean"
    note: "Sphere packings in Lean (Viazovska's theorem project)."

