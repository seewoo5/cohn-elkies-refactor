      module: "CohnElkies/SignUncertainty/Extremizer.lean"
      status: "proved"
      note: "unconditional, for every d ≥ 1; the reduction to an extremizer is signUncertaintyConstant_one_lt_neg_one_of_exists_extremizer (CohnElkies/SignUncertainty/AppendixA.lean)"
