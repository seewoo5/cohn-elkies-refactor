      lean: "PackingBounds.FullMain.exact_limit"
      module: "CohnElkies/PackingBound.lean"
      status: "proved"
      note: "base-2 form: PackingBounds.FullMain.exact_binary_exponent"
    - source: "Equation (4), Δ_d ≤ LP_d, and the sharp packing bound"
      lean: "PackingBounds.PackingBridge.sphere_packing_le_linear_program"
      module: "CohnElkies/PackingBound.lean"
      status: "proved"
      note: "Δ_d ≤ (sqrt(e/(2π)) + o(1))^d: PackingBounds.PackingBridge.sphere_packing_sharp_asymptotic_upper"
    - source: "Theorem 1.2 (A_±(d)/√d → 1/π)"
      lean: "CohnElkies.signUncertaintyConstant_div_sqrt_tendsto"
      module: "CohnElkies/SignUncertainty/Main.lean"
