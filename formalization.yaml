      lean: "PackingBounds.FullMain.exact_limit"
      module: "CohnElkies/PackingBound.lean"
      status: "proved"
      note: "base-2 form: PackingBounds.FullMain.exact_binary_exponent"
    - source: "Equation (4), Δ_d ≤ LP_d, and the sharp packing bound"
      lean: "PackingBounds.PackingBridge.sphere_packing_le_linear_program"
      module: "CohnElkies/PackingBound.lean"
      status: "proved"
      note: "Δ_d ≤ (sqrt(e/(2π)) + o(1))^d: PackingBounds.PackingBridge.sphere_packing_sharp_asymptotic_upper"
    - source: "Theorem 1.2 (A_±(d)/√d → 1/π)"
      lean: "CohnElkies.signUncertaintyConstant_div_sqrt_tendsto"
      module: "CohnElkies/SignUncertainty/Main.lean"
      status: "proved"
      note: "definitions (5)–(6): CohnElkies.SignEigenfunction, signRadius, signUncertaintyConstant (CohnElkies/Basic.lean)"
    - source: "Proposition 3.1"
      lean: "CohnElkies.exists_interior_mass_bound"
      module: "CohnElkies/LowerBound/Main.lean"
      status: "proved"
    - source: "Proposition 3.7 (L¹ class; Schwartz case)"
      lean: "CohnElkies.eventually_not_nonneg_outside_signEigenfunction"
      module: "CohnElkies/SignUncertainty/LowerBound.lean"
      status: "proved"
      note: "Schwartz case: CohnElkies.eventually_not_nonneg_outside"
    - source: "Theorem 3.8"
      lean: "CohnElkies.manuscriptUniversalQuotientBound"
      module: "CohnElkies/Asymptotics/Manuscript.lean"
      status: "proved"
    - source: "Theorem 4.1 / Lemma 4.3 / Corollary 4.9 (f₋, f₊, f₀ and the radius R_{ε,d})"
      lean: "CohnElkies.saddleSourceEventualSigns"
      module: "CohnElkies/UpperBound/Signs.lean"
