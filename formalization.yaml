      note: "f₀: CohnElkies.fZero, fourier_zeroSaddleSchwartz, eventually_fZero_re_pos_of_radius (CohnElkies/UpperBound/SelfFourier.lean)"
    - source: "Section 2.1 (radial reduction of the linear program)"
