name = "CohnElkies"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CohnElkies", "SpherePacking"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "CohnElkies"

[[lean_lib]]
name = "SpherePacking"
